---
- name: WireGuard tunnel from the AWS node to the Alpine VM in the lab
  hosts: fleet
  become: true

  vars:
    wg_port: 51820
    wg_address: "10.99.0.1/30"
    lab_tunnel_ip: "10.99.0.2/32"
    secrets_dir: "{{ lookup('env', 'HOME') }}/.fleet-secrets"

  tasks:
    - name: Look for saved keys in CloudShell
      ansible.builtin.stat:
        path: "{{ secrets_dir }}/{{ item }}"
      delegate_to: localhost
      become: false
      loop:
        - aws.key
        - lab.pub
      register: saved

    - name: Use the saved lab public key
      ansible.builtin.set_fact:
        lab_public_key: "{{ lookup('file', secrets_dir ~ '/lab.pub') | trim }}"
      when: saved.results[1].stat.exists and lab_public_key is not defined

    - name: Install WireGuard
      ansible.builtin.apt:
        name: wireguard
        state: present
        update_cache: true
        lock_timeout: 180

    - name: Install the saved server key from CloudShell
      ansible.builtin.copy:
        src: "{{ secrets_dir }}/aws.key"
        dest: /etc/wireguard/server.key
        owner: root
        group: root
        mode: "0600"
      when: saved.results[0].stat.exists
      no_log: true

    - name: Otherwise create a new server key
      ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/server.key
      args:
        creates: /etc/wireguard/server.key

    - name: Work out the public key
      ansible.builtin.shell: wg pubkey < /etc/wireguard/server.key
      register: wg_pub
      changed_when: false

    - name: Show the public key
      ansible.builtin.debug:
        msg: "AWS WIREGUARD PUBLIC KEY: {{ wg_pub.stdout }}"

    - name: Allow the WireGuard port through the firewall
      community.general.ufw:
        rule: allow
        port: "{{ wg_port }}"
        proto: udp

    - name: Configure and start the tunnel
      when: lab_public_key is defined
      block:
        - name: Read the private key
          ansible.builtin.slurp:
            src: /etc/wireguard/server.key
          register: wg_priv
          no_log: true

        - name: Write the tunnel configuration
          ansible.builtin.copy:
            dest: /etc/wireguard/wg0.conf
            owner: root
            group: root
            mode: "0600"
            content: |
              [Interface]
              Address = {{ wg_address }}
              ListenPort = {{ wg_port }}
              PrivateKey = {{ wg_priv.content | b64decode | trim }}

              [Peer]
              PublicKey = {{ lab_public_key }}
              AllowedIPs = {{ lab_tunnel_ip }}
          no_log: true
          notify: Restart WireGuard

        - name: Start the tunnel now and on every boot
          ansible.builtin.service:
            name: wg-quick@wg0
            state: started
            enabled: true

  handlers:
    - name: Restart WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted
