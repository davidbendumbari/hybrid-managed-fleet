---
- name: WireGuard tunnel from the AWS node to the home lab
  hosts: fleet
  become: true

  vars:
    wg_port: 51820
    wg_address: "10.99.0.1/30"
    lab_tunnel_ip: "10.99.0.2/32"

  tasks:
    - name: Install WireGuard
      ansible.builtin.apt:
        name: wireguard
        state: present
        update_cache: true
        lock_timeout: 180

    - name: Create the server private key (only once)
      ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/server.key
      args:
        creates: /etc/wireguard/server.key

    - name: Keep the private key readable by root only
      ansible.builtin.file:
        path: /etc/wireguard/server.key
        owner: root
        group: root
        mode: "0600"

    - name: Work out the public key
      ansible.builtin.shell: wg pubkey < /etc/wireguard/server.key
      register: wg_pub
      changed_when: false

    - name: Show the public key to paste into OPNsense
      ansible.builtin.debug:
        msg: "AWS WIREGUARD PUBLIC KEY: {{ wg_pub.stdout }}"

    - name: Allow the WireGuard port through the firewall
      community.general.ufw:
        rule: allow
        port: "{{ wg_port }}"
        proto: udp

    - name: Configure and start the tunnel (needs the lab details)
      when: lab_public_key is defined and lab_mgmt_subnet is defined
      block:
        - name: Read the private key
          ansible.builtin.slurp:
            src: /etc/wireguard/server.key
          register: wg_priv
          no_log: true

        - name: Write the tunnel configuration
          ansible.builtin.copy:
            dest: /etc/wireguard/wg0.conf
            owner: root
            group: root
            mode: "0600"
            content: |
              [Interface]
              Address = {{ wg_address }}
              ListenPort = {{ wg_port }}
              PrivateKey = {{ wg_priv.content | b64decode | trim }}

              [Peer]
              PublicKey = {{ lab_public_key }}
              AllowedIPs = {{ lab_tunnel_ip }}, {{ lab_mgmt_subnet }}
          no_log: true
          notify: Restart WireGuard

        - name: Start the tunnel now and on every boot
          ansible.builtin.service:
            name: wg-quick@wg0
            state: started
            enabled: true

  handlers:
    - name: Restart WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted
